<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shop.Mus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<div class="top-bar">
  Regístrate y obtén un 20% de descuento en tu primer pedido.
</div>


<div th:replace="~{fragments/navbar :: navbar}"></div>





  <!-- HERO -->
  <section class="hero">
    <div>
      <h1>Encuentra el instrumento que se adapte a ti</h1>
      <p>Explora nuestra diversa gama de productos</p>
      <a href="/productos" class="btn">Shop Now</a>
    </div>
    <!-- Reemplaza "hero.png" con el nombre de tu imagen en static/img/ -->
    <img th:src="@{/img/hero.png}" src="/img/hero.png" alt="hero" class="hero-img"/>
  </section>

  <!-- PRODUCTOS -->
 <section class="products">

  <h2 class="products-title">PRODUCTOS DESTACADOS</h2>

<div class="products-grid">

    <div class="product-card"
         th:each="producto : ${productosDestacados}">

        <img th:src="@{'/uploads/productos/' + ${producto.imagen}}"
             alt="Producto">

        <h3 th:text="${producto.nombre}">
            Nombre
        </h3>

        <div class="stars">
            ★★★★★ <span>5.0/5</span>
        </div>

        <div class="price">
            <strong
                th:text="'S/ ' + ${producto.precio}">
            </strong>
        </div>

    </div>

</div>



  <div class="view-all-container">
<a th:href="@{/productos}"
   class="view-all-btn">
    Ver Productos
</a>  </div>

</section>

  <!-- FOOTER -->
  <footer>
    <p>Shop.Mus &copy; 2024</p>
  </footer>

  <script th:src="@{/js/app.js}"></script>
</body>
</html>
