<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Shop.Mus</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body>

    <!-- TOP BAR -->
    <div class="top-bar">
        Bienvenido a Shop.Mus — Inicia sesión para continuar
    </div>

    <!-- NAVBAR -->
<div th:replace="~{fragments/navbar :: navbar}"></div>


    <!-- LOGIN -->
    <section class="login-container">

        <div class="login-card">

            <div class="login-left">

                <h1>BIENVENIDO</h1>

                <p>
                    Accede a tu cuenta para administrar tus pedidos,
                    carrito y productos favoritos.
                </p>

                <img th:src="@{/img/hero.png}" src="/uploads/productos/hero.png" alt="hero">
            </div>

            <!-- FORM -->
            <div class="login-right">

                <h2>REGISTRATE</h2>

                <form th:action="@{/registro}" method="post" th:object="${usuario}">

                    <div class="input-group">
                        <label>Nombre</label>
                        <input type="text" th:field="*{nombre}" required minlength="2">
                    </div>
                    <div th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}">
                    </div>
                    <div class="input-group">
                        <label>Correo</label>
                        <input type="email" th:field="*{email}" required>
                        <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Contraseña</label>
                        <input type="password" th:field="*{contrasena}" required minlength="6">
                    </div>
                    <div th:if="${#fields.hasErrors('contrasena')}" th:errors="*{contrasena}">
                    </div>



                    <button type="submit" class="login-btn">
                        Registrarse
                    </button>

                </form>


                <div class="extra-links">
                    <a href="#">¿Olvidaste tu contraseña?</a>
                    <a href="#">Crear cuenta</a>
                </div>

            </div>

        </div>

    </section>

    <!-- FOOTER -->
    <footer>
        <p>Shop.Mus &copy; 2024</p>
    </footer>

</body>

</html>
